[project]
name = "omnigate"
version = "0.1.0"
description = "Browser capability library for AI agents: drive Edge, reuse login state, extract audio to text."
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.9",
    "requests>=2.32.4",
]

[project.scripts]
omnigate = "omnigate.cli:main"

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omnigate*"]
